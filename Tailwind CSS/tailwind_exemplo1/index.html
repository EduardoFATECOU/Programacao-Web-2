<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailwind CSS CRUD (Sem Banco de Dados)</title>
 
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
</head> 
<body class="bg-gray-100 p-6 sm:p-12">
 
<div class="max-w-5xl mx-auto bg-white rounded-lg shadow-lg p-6">
 
<h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">
📋 Gerenciador de Usuários
</h1>
 
<!-- FORMULÁRIO -->
<form
id="userForm"
class="mb-8 bg-gray-50 p-4 rounded-md border">
 
<input type="hidden" id="userId">
 
<div class="grid grid-cols-12 gap-4 items-end">
 
<!-- Nome -->
<div class="col-span-12 md:col-span-5">
 
<label
for="userName"
class="block text-sm font-medium text-gray-700 mb-1">
 
Nome
 
</label>
 
<input
type="text"
id="userName"
required
class="w-full h-11 px-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
 
</div>
 
<!-- Email -->
<div class="col-span-12 md:col-span-5">
 
<label
for="userEmail"
class="block text-sm font-medium text-gray-700 mb-1">
 
E-mail
 
</label>
 
<input
type="email"
id="userEmail"
required
class="w-full h-11 px-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
 
</div>
 
<!-- Botão -->
<div class="col-span-12 md:col-span-2">
 
<button
type="submit"
id="submitBtn"
class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow transition">
 
Adicionar Usuário
 
</button>
 
</div>
 
</div>
 
</form>
 
<!-- TABELA -->
 
<div class="overflow-x-auto">
<table class="min-w-full divide-y divide-gray-200">
 
<thead class="bg-gray-50">
 
<tr>
<th class="px-6 py-3 text-left text-xs font-medium uppercase">
Nome
</th>
 
<th class="px-6 py-3 text-left text-xs font-medium uppercase">
E-mail
</th>
 
<th class="px-6 py-3 text-right text-xs font-medium uppercase">
Ações
</th>
</tr>
 
</thead>
 
<tbody id="userTableBody"
class="bg-white divide-y divide-gray-200">
</tbody>
 
</table>
</div>
</div>
 
<script>
 
// ========================================
// CARREGA DADOS
// ========================================
 
let users = JSON.parse(
localStorage.getItem('users')
) || [
{
id: 1,
name: 'Ana Silva',
email: 'ana@email.com'
},
{
id: 2,
name: 'Carlos Souza',
email: 'carlos@email.com'
}
];
 
function saveData() {
localStorage.setItem(
'users',
JSON.stringify(users)
);
}
 
// ========================================
// ELEMENTOS
// ========================================
 
const userForm = document.getElementById('userForm');
const userIdInput = document.getElementById('userId');
const userNameInput = document.getElementById('userName');
const userEmailInput = document.getElementById('userEmail');
const submitBtn = document.getElementById('submitBtn');
const userTableBody = document.getElementById('userTableBody');
 
// ========================================
// RENDERIZA TABELA
// ========================================
 
function renderTable() {
 
userTableBody.innerHTML = '';
 
if (users.length === 0) {
 
userTableBody.innerHTML = `
<tr>
<td colspan="3"
class="text-center py-4 text-gray-500">
 
Nenhum usuário cadastrado.
 
</td>
</tr>
`;
 
return;
}
 
users.forEach(user => {
 
const tr = document.createElement('tr');
 
tr.innerHTML = `
<td class="px-6 py-4">
${user.name}
</td>
 
<td class="px-6 py-4">
${user.email}
</td>
 
<td class="px-6 py-4 text-right">
 
<button
onclick="editUser(${user.id})"
class="text-indigo-600 hover:text-indigo-900 mr-4">
 
Editar
 
</button>
 
<button
onclick="deleteUser(${user.id})"
class="text-red-600 hover:text-red-900">
 
Excluir
 
</button>
 
</td>
`;
 
userTableBody.appendChild(tr);
 
});
 
}
 
// ========================================
// CREATE / UPDATE
// ========================================
 
userForm.addEventListener('submit', function (e) {
 
e.preventDefault();
 
const id = userIdInput.value;
 
const name = userNameInput.value.trim();
 
const email = userEmailInput.value
.trim()
.toLowerCase();
 
const emailExists = users.some(user =>
user.email.toLowerCase() === email &&
user.id != id
);
 
if (emailExists) {
alert('Este e-mail já está cadastrado.');
return;
}
 
if (id) {
 
users = users.map(user =>
 
user.id == id
? {
id: Number(id),
name,
email
}
: user
 
);
 
submitBtn.innerText =
'Adicionar Usuário';
 
submitBtn.classList.remove(
'bg-amber-500',
'hover:bg-amber-600'
);
 
submitBtn.classList.add(
'bg-blue-600',
'hover:bg-blue-700'
);
 
} else {
 
users.push({
id: Date.now(),
name,
email
});
 
}
 
saveData();
 
userForm.reset();
 
userIdInput.value = '';
 
renderTable();
 
});
 
// ========================================
// EDIT
// ========================================
 
function editUser(id) {
 
const user =
users.find(u => u.id === id);
 
if (!user) return;
 
userIdInput.value =
user.id;
 
userNameInput.value =
user.name;
 
userEmailInput.value =
user.email;
 
submitBtn.innerText =
'Salvar Alterações';
 
submitBtn.classList.remove(
'bg-blue-600',
'hover:bg-blue-700'
);
 
submitBtn.classList.add(
'bg-amber-500',
'hover:bg-amber-600'
);
}
 
// ========================================
// DELETE
// ========================================
 
function deleteUser(id) {
 
if (
!confirm(
'Deseja realmente excluir este usuário?'
)
) {
return;
}
 
users =
users.filter(
user => user.id !== id
);
 
saveData();
 
renderTable();
 
if (
userIdInput.value == id
) {
 
userForm.reset();
 
userIdInput.value = '';
 
submitBtn.innerText =
'Adicionar Usuário';
 
submitBtn.classList.remove(
'bg-amber-500',
'hover:bg-amber-600'
);
 
submitBtn.classList.add(
'bg-blue-600',
'hover:bg-blue-700'
);
}
 
}
 
// ========================================
// INICIALIZA
// ========================================
 
renderTable();
 
</script>
 
</body>
</html>
