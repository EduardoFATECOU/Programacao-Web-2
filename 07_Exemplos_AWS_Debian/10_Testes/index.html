<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testes - Programação Web II</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .teste-passo { background-color: #d4edda; color: #155724; }
    .teste-falhou { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container py-5">
    <h1 class="text-3xl font-bold text-center mb-2">Testes no Navegador</h1>
    <p class="text-center text-muted mb-4">Suite de testes simulada — resultados exibidos na tela</p>

    <div class="text-center mb-4">
      <button id="btnExecutar" class="btn btn-primary btn-lg" onclick="executarTestes()">
        Executar Testes
      </button>
    </div>

    <div id="resultados" class="row g-4"></div>
  </div>

  <script>
    // ===== Funções para testar =====

    function somar(a, b) {
      return a + b;
    }

    function validarCPF(cpf) {
      if (!cpf) return false;
      cpf = cpf.replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf[i - 1]) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== parseInt(cpf[9])) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf[i - 1]) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;
      if (resto !== parseInt(cpf[10])) return false;
      return true;
    }

    function ehPar(numero) {
      return numero % 2 === 0;
    }

    // ===== Suite de testes =====

    function testar(descricao, fn) {
      try {
        const resultado = fn();
        return { descricao, passou: resultado === true, erro: null };
      } catch (e) {
        return { descricao, passou: false, erro: e.message };
      }
    }

    function suiteSomar() {
      return [
        testar('somar(2, 3) deve retornar 5', () => somar(2, 3) === 5),
        testar('somar(-1, 1) deve retornar 0', () => somar(-1, 1) === 0),
        testar('somar(0, 0) deve retornar 0', () => somar(0, 0) === 0),
        testar('somar(10, 20) deve retornar 30', () => somar(10, 20) === 30),
      ];
    }

    function suiteValidarCPF() {
      return [
        testar('CPF 529.982.247-25 deve ser válido', () => validarCPF('529.982.247-25') === true),
        testar('CPF 111.111.111-11 deve ser inválido', () => validarCPF('111.111.111-11') === false),
        testar('CPF vazio deve ser inválido', () => validarCPF('') === false),
        testar('CPF 123.456.789-00 deve ser inválido', () => validarCPF('123.456.789-00') === false),
      ];
    }

    function suiteEhPar() {
      return [
        testar('ehPar(2) deve retornar true', () => ehPar(2) === true),
        testar('ehPar(3) deve retornar false', () => ehPar(3) === false),
        testar('ehPar(0) deve retornar true', () => ehPar(0) === true),
        testar('ehPar(-4) deve retornar true', () => ehPar(-4) === true),
      ];
    }

    const todasSuites = [
      { nome: 'Função: somar(a, b)', testes: suiteSomar },
      { nome: 'Função: validarCPF(cpf)', testes: suiteValidarCPF },
      { nome: 'Função: ehPar(numero)', testes: suiteEhPar },
    ];

    function executarTestes() {
      const container = document.getElementById('resultados');
      const btn = document.getElementById('btnExecutar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Executando...';

      setTimeout(() => {
        let html = '';
        let totalPassou = 0;
        let totalFalhou = 0;

        todasSuites.forEach(suite => {
          const resultados = suite.testes();
          const passou = resultados.filter(r => r.passou).length;
          const falhou = resultados.filter(r => !r.passou).length;
          totalPassou += passou;
          totalFalhou += falhou;

          html += `
            <div class="col-12">
              <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">${suite.nome}</h5>
                  <span>
                    <span class="badge bg-success me-1">${passou} passaram</span>
                    ${falhou > 0 ? `<span class="badge bg-danger">${falhou} falharam</span>` : ''}
                  </span>
                </div>
                <div class="card-body p-0">
                  <ul class="list-group list-group-flush">
                    ${resultados.map(r => `
                      <li class="list-group-item ${r.passou ? 'teste-passo' : 'teste-falhou'}">
                        <div class="d-flex align-items-center">
                          <span class="me-2">${r.passou ? '✅' : '❌'}</span>
                          <span>${r.descricao}</span>
                          ${r.erro ? `<span class="ms-2 text-danger">(${r.erro})</span>` : ''}
                        </div>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            </div>
          `;
        });

        html += `
          <div class="col-12">
            <div class="alert ${totalFalhou === 0 ? 'alert-success' : 'alert-danger'} text-center">
              <h4 class="mb-0">
                ${totalFalhou === 0 ? '✅ Todos os testes passaram!' : `❌ ${totalFalhou} teste(s) falharam`}
              </h4>
              <p class="mb-0">${totalPassou} passaram, ${totalFalhou} falharam (total: ${totalPassou + totalFalhou})</p>
            </div>
          </div>
        `;

        container.innerHTML = html;
        btn.disabled = false;
        btn.innerHTML = 'Executar Testes';
      }, 500);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
