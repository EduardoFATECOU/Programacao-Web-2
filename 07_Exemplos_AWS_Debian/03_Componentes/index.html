<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Componentes - Programação Web II</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="container py-5">
    <h1 class="text-3xl font-bold text-center mb-5">Componentes React</h1>

    <!-- Exemplo 1 -->
    <div class="card mb-5 shadow-sm">
      <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Exemplo 1: Componente Saudacao com prop "nome"</h2>
      </div>
      <div class="card-body">
        <div id="ex1-root"></div>
      </div>
    </div>

    <!-- Exemplo 2 -->
    <div class="card mb-5 shadow-sm">
      <div class="card-header bg-success text-white">
        <h2 class="h5 mb-0">Exemplo 2: Composição de Componentes</h2>
      </div>
      <div class="card-body">
        <div id="ex2-root" class="d-flex flex-wrap gap-4"></div>
      </div>
    </div>

    <!-- Exemplo 3 -->
    <div class="card mb-5 shadow-sm">
      <div class="card-header bg-warning text-dark">
        <h2 class="h5 mb-0">Exemplo 3: Botão Reutilizável com Props Variantes</h2>
      </div>
      <div class="card-body">
        <div id="ex3-root" class="d-flex flex-wrap gap-3"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    // Exemplo 1: Saudação
    function Saudacao({ nome }) {
      return <div className="alert alert-info">Olá, <strong>{nome}</strong>! Seja bem-vindo(a).</div>;
    }
    ReactDOM.createRoot(document.getElementById('ex1-root')).render(
      <div>
        <Saudacao nome="Maria" />
        <Saudacao nome="João" />
        <Saudacao nome="Ana" />
      </div>
    );

    // Exemplo 2: Composição
    function Avatar({ nome }) {
      const cor = ['#0d6efd', '#198754', '#dc3545', '#ffc107', '#0dcaf0'];
      const i = nome.length % cor.length;
      return (
        <div className="d-flex align-items-center justify-content-center rounded-circle text-white fw-bold"
          style={{ width: 60, height: 60, backgroundColor: cor[i], fontSize: 24 }}>
          {nome[0].toUpperCase()}
        </div>
      );
    }
    function Informacao({ label, valor }) {
      return <p className="mb-1"><strong>{label}:</strong> {valor}</p>;
    }
    function CardUsuario({ nome, email, cargo }) {
      return (
        <div className="card shadow-sm" style={{ width: 220 }}>
          <div className="card-body text-center">
            <Avatar nome={nome} />
            <h5 className="mt-2">{nome}</h5>
            <Informacao label="Email" valor={email} />
            <Informacao label="Cargo" valor={cargo} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('ex2-root')).render(
      <>
        <CardUsuario nome="Maria Silva" email="maria@email.com" cargo="Desenvolvedora" />
        <CardUsuario nome="João Souza" email="joao@email.com" cargo="Designer" />
        <CardUsuario nome="Ana Costa" email="ana@email.com" cargo="Gerente" />
      </>
    );

    // Exemplo 3: Botão reutilizável
    function Botao({ children, variante = 'primario', onClick }) {
      const estilos = {
        primario: 'btn btn-primary',
        secundario: 'btn btn-secondary',
        sucesso: 'btn btn-success',
        perigo: 'btn btn-danger',
        aviso: 'btn btn-warning',
      };
      return <button className={estilos[variante] || estilos.primario} onClick={onClick}>{children}</button>;
    }
    ReactDOM.createRoot(document.getElementById('ex3-root')).render(
      <>
        <Botao variante="primario" onClick={() => alert('Primário')}>Primário</Botao>
        <Botao variante="secundario" onClick={() => alert('Secundário')}>Secundário</Botao>
        <Botao variante="sucesso" onClick={() => alert('Sucesso')}>Sucesso</Botao>
        <Botao variante="perigo" onClick={() => alert('Perigo')}>Perigo</Botao>
        <Botao variante="aviso" onClick={() => alert('Aviso')}>Aviso</Botao>
      </>
    );
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
