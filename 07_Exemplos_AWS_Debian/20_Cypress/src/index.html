<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Exemplo - Cypress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: system-ui, sans-serif; }
        .container { max-width: 600px; margin: 40px auto; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .concluida { text-decoration: line-through; color: #999; }
        .nav-link.active { font-weight: bold; }
        #error-msg { display: none; }
        #dashboard { display: none; }
        #tarefas-view { display: none; }
    </style>
</head>
<body>
<div class="container">
    <ul class="nav nav-tabs mb-4" id="main-nav">
        <li class="nav-item"><a class="nav-link active" href="#login" data-view="login">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="#tarefas" data-view="tarefas">Tarefas</a></li>
    </ul>

    <div id="login-view">
        <div class="card p-4">
            <h3 class="mb-3">Login</h3>
            <div id="error-msg" class="alert alert-danger">Credenciais inválidas</div>
            <div id="dashboard" class="alert alert-success">Bem-vindo, admin!</div>
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="Senha">
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <button type="button" class="btn btn-secondary" id="logout-btn" style="display:none">Sair</button>
            </form>
        </div>
    </div>

    <div id="tarefas-view" style="display:none">
        <div class="card p-4">
            <h3 class="mb-3">Lista de Tarefas</h3>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="nova-tarefa" placeholder="Nova tarefa">
                <button class="btn btn-primary" id="btn-adicionar">Adicionar</button>
            </div>
            <ul class="list-group" id="lista-tarefas"></ul>
        </div>
    </div>
</div>

<script>
    const app = {
        logado: false,

        init() {
            this.navegacao();
            this.formLogin();
            this.tarefas();
            this.navegar(window.location.hash || '#login');
        },

        navegacao() {
            document.querySelectorAll('[data-view]').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    this.navegar(link.getAttribute('href'));
                });
            });
            window.addEventListener('hashchange', () => this.navegar(window.location.hash));
        },

        navegar(hash) {
            const view = hash.replace('#', '') || 'login';
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const link = document.querySelector(`[data-view="${view}"]`);
            if (link) link.classList.add('active');
            document.getElementById('login-view').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('tarefas-view').style.display = view === 'tarefas' ? 'block' : 'none';
        },

        formLogin() {
            document.getElementById('login-form').addEventListener('submit', e => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const senha = document.getElementById('password').value;
                const errorMsg = document.getElementById('error-msg');
                const dashboard = document.getElementById('dashboard');

                if (email === 'admin@email.com' && senha === '123456') {
                    errorMsg.style.display = 'none';
                    dashboard.style.display = 'block';
                    this.logado = true;
                    document.querySelector('#login-form button[type="submit"]').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline-block';
                } else {
                    errorMsg.style.display = 'block';
                    dashboard.style.display = 'none';
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                this.logado = false;
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('error-msg').style.display = 'none';
                document.querySelector('#login-form button[type="submit"]').style.display = 'inline-block';
                document.getElementById('logout-btn').style.display = 'none';
            });
        },

        tarefas() {
            const input = document.getElementById('nova-tarefa');
            const btn = document.getElementById('btn-adicionar');
            const lista = document.getElementById('lista-tarefas');

            function renderizar() {
                const tarefas = JSON.parse(localStorage.getItem('tarefas') || '[]');
                lista.innerHTML = tarefas.map((t, i) => `
                    <li class="list-group-item d-flex align-items-center gap-2 ${t.feita ? 'concluida' : ''}">
                        <input type="checkbox" class="form-check-input m-0" ${t.feita ? 'checked' : ''} data-index="${i}">
                        <span class="flex-grow-1">${t.texto}</span>
                        <button class="btn btn-sm btn-outline-danger remover" data-index="${i}">Remover</button>
                    </li>
                `).join('');
            }

            btn.addEventListener('click', () => {
                const texto = input.value.trim();
                if (!texto) return;
                const tarefas = JSON.parse(localStorage.getItem('tarefas') || '[]');
                tarefas.push({ texto, feita: false });
                localStorage.setItem('tarefas', JSON.stringify(tarefas));
                input.value = '';
                renderizar();
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') btn.click();
            });

            lista.addEventListener('click', e => {
                const tarefas = JSON.parse(localStorage.getItem('tarefas') || '[]');
                const checkbox = e.target.closest('input[type="checkbox"]');
                const remover = e.target.closest('.remover');
                if (checkbox) {
                    const i = parseInt(checkbox.dataset.index);
                    tarefas[i].feita = checkbox.checked;
                    localStorage.setItem('tarefas', JSON.stringify(tarefas));
                    renderizar();
                }
                if (remover) {
                    const i = parseInt(remover.dataset.index);
                    tarefas.splice(i, 1);
                    localStorage.setItem('tarefas', JSON.stringify(tarefas));
                    renderizar();
                }
            });

            renderizar();
        }
    };

    app.init();
</script>
</body>
</html>
